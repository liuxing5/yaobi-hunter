services:
  - type: web
    name: yaobi-hunter
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # 公网 Dashboard 必须开启认证，否则任何人都能改参数/平仓。
      # Render 会自动生成强密码，部署后在 Environment 页查看/修改。
      - key: DASHBOARD_USER
        value: admin
      - key: DASHBOARD_PASSWORD
        generateValue: true
